<!DOCTYPE html>
<!--
  index.html — Personal Dashboard
  Structure for: greeting/clock, focus timer, to-do list, quick links.
  Links to css/style.css and js/app.js (no frameworks, no backend).
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting, Clock, Theme Toggle ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="greeting-block">
        <h1 id="greeting">Good Morning</h1>
        <p id="current-time" class="time-display">00:00:00</p>
        <p id="current-date" class="date-display">Monday, January 1, 2024</p>
      </div>
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle light/dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="dashboard-grid">

    <!-- ===== FOCUS TIMER SECTION ===== -->
    <section class="card" id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus Timer</h2>
      <div class="timer-display" id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
      <div id="timer-banner" class="timer-banner hidden" role="alert" aria-live="assertive">
        ⏰ Time's up! Take a break.
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled>⏸ Stop</button>
        <button id="timer-reset" class="btn btn-secondary">↺ Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST SECTION ===== -->
    <section class="card" id="todo-section" aria-labelledby="todo-heading">
      <h2 id="todo-heading">To-Do List</h2>

      <!-- Add task row -->
      <div class="input-row">
        <input
          type="text"
          id="task-input"
          class="text-input"
          placeholder="Add a new task…"
          aria-label="New task text"
          maxlength="200"
        />
        <button id="task-add" class="btn btn-primary">Add</button>
      </div>
      <p id="task-error" class="error-msg hidden" role="alert" aria-live="polite"></p>

      <!-- Sort controls -->
      <div class="sort-row">
        <label for="task-sort" class="sort-label">Sort:</label>
        <select id="task-sort" class="select-input" aria-label="Sort tasks">
          <option value="date-desc">Newest First</option>
          <option value="name-asc">Name (A–Z)</option>
          <option value="status">Status (Incomplete First)</option>
        </select>
      </div>

      <!-- Task list -->
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
    </section>

    <!-- ===== QUICK LINKS SECTION ===== -->
    <section class="card" id="links-section" aria-labelledby="links-heading">
      <h2 id="links-heading">Quick Links</h2>

      <!-- Add link row -->
      <div class="input-row">
        <input
          type="text"
          id="link-name-input"
          class="text-input"
          placeholder="Link name…"
          aria-label="Link name"
          maxlength="100"
        />
        <input
          type="url"
          id="link-url-input"
          class="text-input"
          placeholder="https://example.com"
          aria-label="Link URL"
          maxlength="2000"
        />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>
      <p id="link-error" class="error-msg hidden" role="alert" aria-live="polite"></p>

      <!-- Links grid -->
      <div id="links-grid" class="links-grid" aria-label="Quick links"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
