<!DOCTYPE html>
<!--
  index.html — To-Do List Life Dashboard
  Structure for: greeting/clock, focus timer, to-do list, quick links.
  Links to css/style.css and js/app.js (no frameworks, no backend).
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting, Clock, Theme Toggle ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="greeting-block">
        <h1 id="greeting">Good Morning</h1>
        <p id="current-time" class="time-display">00:00:00</p>
        <p id="current-date" class="date-display">Monday, January 1, 2024</p>
      </div>
      <!-- Controls: theme toggle + language switch stacked -->
      <div class="header-controls">
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode" title="Toggle light/dark mode">
          <!-- Moon icon (light mode) -->
          <svg id="icon-moon" class="theme-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun icon (dark mode — hidden by default) -->
          <svg id="icon-sun" class="theme-svg hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <!-- Language switch -->
        <div class="lang-switch" role="group" aria-label="Language selector">
          <button id="lang-en" class="lang-btn active" aria-pressed="true"  data-lang="en">EN</button>
          <button id="lang-id" class="lang-btn"        aria-pressed="false" data-lang="id">ID</button>
        </div>
      </div>
    </div>
  </header>

  <main class="dashboard-grid">

    <!-- ===== FOCUS TIMER SECTION ===== -->
    <section class="card" id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading" data-i18n="timerTitle">Focus Timer</h2>
      <div class="timer-display" id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
      <div id="timer-banner" class="timer-banner hidden" role="alert" aria-live="assertive" data-i18n="timerDone">
        Time's up! Take a break.
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary"  data-i18n="timerStart">▶ Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled data-i18n="timerStop">⏸ Stop</button>
        <button id="timer-reset" class="btn btn-secondary" data-i18n="timerReset">↺ Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST SECTION ===== -->
    <section class="card" id="todo-section" aria-labelledby="todo-heading">
      <h2 id="todo-heading" data-i18n="tasksTitle">Tasks</h2>

      <!-- Task controls: input+add (kiri) dan sort (kanan) -->
      <div class="task-controls">
        <div class="task-input-row">
          <input
            type="text"
            id="task-input"
            class="text-input"
            placeholder="Add a new task…"
            data-i18n-placeholder="taskPlaceholder"
            aria-label="New task text"
            maxlength="200"
          />
          <button id="task-add" class="btn btn-primary" data-i18n="addBtn">Add</button>
        </div>
        <div class="task-sort-row">
          <label for="task-sort" class="sort-label" data-i18n="sortLabel">Sort:</label>
          <select id="task-sort" class="select-input" aria-label="Sort tasks">
            <option value="date-desc" data-i18n="sortNewest">Newest First</option>
            <option value="name-asc"  data-i18n="sortName">Name (A–Z)</option>
            <option value="status"    data-i18n="sortStatus">Status (Incomplete First)</option>
          </select>
        </div>
      </div>
      <p id="task-error" class="error-msg hidden" role="alert" aria-live="polite"></p>

      <!-- Task list -->
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
    </section>

    <!-- ===== QUICK LINKS SECTION ===== -->
    <section class="card" id="links-section" aria-labelledby="links-heading">
      <h2 id="links-heading" data-i18n="linksTitle">Quick Links</h2>

      <!-- Add link row -->
      <div class="input-row">
        <input
          type="text"
          id="link-name-input"
          class="text-input"
          placeholder="Link name…"
          data-i18n-placeholder="linkNamePlaceholder"
          aria-label="Link name"
          maxlength="100"
        />
        <input
          type="url"
          id="link-url-input"
          class="text-input"
          placeholder="URL"
          data-i18n-placeholder="linkUrlPlaceholder"
          aria-label="Link URL"
          maxlength="2000"
        />
        <button id="link-add" class="btn btn-primary" data-i18n="addBtn">Add</button>
      </div>
      <p id="link-error" class="error-msg hidden" role="alert" aria-live="polite"></p>

      <!-- Links grid -->
      <div id="links-grid" class="links-grid" aria-label="Quick links"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
